<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis juegos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1F4E79">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#FFF8E7;color:#1b1b1b;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;touch-action:manipulation;overscroll-behavior:none}
#app{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;padding:2vh 3vw}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Menús */
.h1{font-weight:bold;text-align:center;color:#1F4E79;margin:2vh 0 2vh}
#mbox{text-align:center}
.mbtn{display:inline-block;vertical-align:top;margin:7px;border:0;border-radius:28px;color:#fff;font-weight:bold;font-family:inherit;box-shadow:0 8px 0 rgba(0,0,0,.28);padding:0 10px;line-height:1.15}
.mbtn:active{box-shadow:0 2px 0 rgba(0,0,0,.28);-webkit-transform:translateY(6px);transform:translateY(6px)}
.mbtn .ic{display:block;line-height:1.1;margin-bottom:.15em}
#gear{position:absolute;right:12px;bottom:12px;width:70px;height:70px;line-height:70px;text-align:center;font-size:36px;opacity:.18;color:#555}

/* Barra superior y mensajes */
.top{display:-webkit-flex;display:flex;align-items:center;height:9vh;min-height:50px}
.back{height:100%;font-size:3.6vh;white-space:nowrap;font-weight:bold;padding:0 3vw;border:3px solid #1F4E79;border-radius:16px;background:#fff;color:#1F4E79;font-family:inherit}
.ttl{font-size:4.4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold;margin-left:3vw;color:#1F4E79}
#msg{height:6vh;min-height:30px;line-height:6vh;font-size:4vh;text-align:center;font-weight:bold;color:#1b5e20;white-space:nowrap;overflow:hidden}

/* Cartas (parejas) */
.card{display:inline-block;position:relative;vertical-align:top;border-radius:18px;overflow:hidden;border:6px solid #1F4E79;background:#fff}
.card .cb{position:absolute;top:0;left:0;right:0;bottom:0;background:#1F4E79;color:#fff;text-align:center;font-weight:bold}
.card .cf{position:absolute;top:0;left:0;right:0;bottom:0;display:none;text-align:center;background:#fff}
.card.up .cb,.card.done .cb{display:none}
.card.up .cf,.card.done .cf{display:block}
.card.done{border-color:#2E7D32}
.card.sel{border-color:#F9A825;box-shadow:0 0 0 4px #FFE082}
.card.hint{border-color:#E65100;-webkit-animation:pulse 1s infinite;animation:pulse 1s infinite}
@-webkit-keyframes pulse{50%{opacity:.5}}
@keyframes pulse{50%{opacity:.5}}
.cf img{width:100%;height:100%;object-fit:contain;background:#fff}
.card.done .cf img,.card.done .dc{opacity:.3}
.card.done .cf:after{content:'\2714';position:absolute;left:0;right:0;top:50%;margin-top:-.55em;font-size:1em;line-height:1.1;color:#2E7D32;font-weight:bold;text-shadow:0 0 6px #fff,0 0 12px #fff}
.card.wrong{border-color:#E65100}
.qq{font-size:4.4vh;font-weight:bold;color:#1F4E79;text-align:center;min-height:6.5vh;padding:0 2vw;line-height:1.15}
.scene{position:relative;margin:0 auto;background:#fff;border:4px solid #1F4E79;border-radius:20px;overflow:hidden;touch-action:manipulation}
.ob{position:absolute;text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none}
.ob.found{opacity:.28}
.ob.found:after{content:'\2714';position:absolute;left:0;right:0;top:0;font-size:.8em;color:#2E7D32;font-weight:bold;text-shadow:0 0 4px #fff,0 0 8px #fff}
.ob.hint{-webkit-animation:pulse .7s infinite;animation:pulse .7s infinite;background:#FFE0B2;border-radius:50%}
.dpulse{-webkit-animation:pulse .7s infinite;animation:pulse .7s infinite}
.cf .lab{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-weight:bold;padding:2px 4px}
.dc{height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#FFF3E0,#FFCCBC);color:#BF360C;text-align:center}

/* Sopa de letras */
#ws.land{display:-webkit-flex;display:flex;align-items:flex-start;justify-content:center}
#grid{-webkit-flex:none;flex:none;touch-action:none;margin:0 auto}
.row{white-space:nowrap;font-size:0}
.cell{display:inline-block;margin:2px;text-align:center;font-weight:bold;background:#fff;border:2px solid #1F4E79;color:#1b1b1b;border-radius:8px;vertical-align:top}
.cell.sel{background:#FFE082}
.cell.found{background:#A5D6A7;border-color:#2E7D32}
.cell.hint{background:#FFB74D}
.lbl{color:#555;margin-bottom:.5vh}
.w{display:inline-block;margin:5px;padding:6px 12px;font-weight:bold;background:#fff;border:3px solid #1F4E79;border-radius:14px;color:#1F4E79}
.w.ok{background:#A5D6A7;border-color:#2E7D32;color:#1b5e20}

/* Preguntas y horas */
.q{font-weight:bold;color:#1F4E79;text-align:center;margin:.5vh 0 1vh;border-radius:20px;padding:1vh 2vw;line-height:1.2}
.qn{text-align:center;color:#777;margin-bottom:1vh}
.opt{display:block;width:100%;margin:8px 0;border:4px solid #1F4E79;background:#fff;color:#1F4E79;border-radius:20px;font-weight:bold;font-family:inherit;padding:8px 14px;line-height:1.2}
.opt.half{display:inline-block;width:48%;margin:1%;vertical-align:top}
.opt.off{opacity:.35;border-color:#999;color:#666}
.opt.ok{background:#A5D6A7;border-color:#2E7D32;color:#1b5e20}
.opt.hint{border-color:#E65100;-webkit-animation:pulse 1s infinite;animation:pulse 1s infinite}
.hrow{display:-webkit-flex;display:flex;align-items:center}
.hl{width:42%}
.hr{width:58%;padding-left:2vw}
.sky{position:relative;border-radius:24px;overflow:hidden;border:4px solid #1F4E79}
.sky-m{background:linear-gradient(#FFE082,#FFF8E1)}
.sky-t{background:linear-gradient(#FFB74D,#FFE0B2)}
.sky-n{background:linear-gradient(#283593,#7986CB)}
.sky .pi{position:absolute;left:8px;top:2px;line-height:1.1}
.sky svg{display:block;margin:0 auto}
.ck{display:inline-block;vertical-align:top;margin:6px;text-align:center;border-radius:24px;border:4px solid #1F4E79;background:#fff;overflow:hidden;font-family:inherit;padding:0;color:#1F4E79;font-weight:bold}
.ck .sky{border:0;border-radius:0}
.ck.off{opacity:.35;border-color:#999}
.ck.ok{border-color:#2E7D32;background:#A5D6A7}
.ck.hint{border-color:#E65100;-webkit-animation:pulse 1s infinite;animation:pulse 1s infinite}
.hq{text-align:center;font-weight:bold;color:#1F4E79}

@media (max-aspect-ratio:1/1){#msg{font-size:4.4vw}}
/* Sumas y restas */
.sumwrap{display:block}
.sumwrap.land{display:-webkit-flex;display:flex;align-items:center;justify-content:space-around}
.sumpanel{display:inline-block;min-width:48vmin;border:6px solid #1F4E79;border-radius:24px;padding:1.5vh 4vw;text-align:right;font-weight:bold;margin-bottom:1.5vh;vertical-align:top}
.srow{line-height:1.15;color:#1b1b1b}
.sop{display:inline-block;margin-right:.5em;font-weight:bold}
.sline{height:6px;margin:.15em 0 .1em;border-radius:3px}
.sans{line-height:1.25;min-height:1.25em;white-space:nowrap}
.dig{display:inline-block;min-width:.75em;margin-left:.08em;border-bottom:4px solid currentColor;text-align:center}
.keypad{display:inline-block;vertical-align:top;margin:0 auto}
.kkey{display:inline-block;vertical-align:top;margin:5px;border:4px solid #1F4E79;border-radius:20px;background:#fff;color:#1F4E79;font-weight:bold;font-family:inherit;padding:0}
.kkey:active{-webkit-transform:translateY(3px);transform:translateY(3px)}
/* Final de partida */
.ov{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,248,231,.97);z-index:10;text-align:center;padding-top:12vh;overflow-y:auto}
.ov .big{font-size:9vh;font-weight:bold;color:#1b5e20;margin-bottom:7vh;padding:0 4vw}
.ov .big.sm{font-size:4.5vh;color:#1F4E79}
.bigbtn{display:block;width:76%;margin:0 auto 4vh;font-weight:bold;color:#fff;background:#1F4E79;border:0;border-radius:28px;box-shadow:0 8px 0 #12304d;font-family:inherit;min-height:14vh;padding:1vh 2vw;font-size:5.5vh}
.bigbtn:active{box-shadow:0 2px 0 #12304d;-webkit-transform:translateY(6px);transform:translateY(6px)}

/* Panel de ajustes (solo para quien configura) */
.adm{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 24px 80px;font-size:18px}
.adm h2{color:#1F4E79;margin:28px 0 8px;font-size:24px}
.ahead{display:-webkit-flex;display:flex;align-items:center;margin-bottom:8px}
.atitle{font-size:26px;font-weight:bold;margin-left:16px}
.adm .back{height:56px;font-size:20px;padding:0 20px}
.abtn{font-size:18px;padding:10px 16px;border:2px solid #1F4E79;background:#fff;color:#1F4E79;border-radius:10px;font-family:inherit}
.abtn.red{border-color:#b71c1c;color:#b71c1c}
.box{background:#fff;border:2px solid #ccc;border-radius:12px;padding:16px;margin-top:12px}
.prow{background:#fff;border:1px solid #ccc;border-radius:12px;padding:8px;margin-top:8px}
.prow .pn{font-size:20px;margin-bottom:6px}
.slot{display:inline-block;width:92px;margin-right:10px;text-align:center;vertical-align:top;font-size:14px;color:#555}
.slot img{display:block;width:92px;height:92px;object-fit:cover;border-radius:8px;margin-bottom:4px}
.slot .ph{width:92px;height:92px;line-height:92px;background:#eee;border-radius:8px;margin-bottom:4px;color:#999}
select{font-size:18px;padding:8px;border:2px solid #999;border-radius:8px;font-family:inherit}
.small{font-size:16px;color:#555}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

var app=document.getElementById('app');
var data=null,cur=null,timers=[],lw=0,lh=0;

/* ================= utilidades ================= */
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a,n){return shuffle(a).slice(0,n)}
function uniq(a){var o=[],s={};for(var i=0;i<a.length;i++){var k=String(a[i]);if(!s[k]){s[k]=1;o.push(a[i])}}return o}
function clear(){app.innerHTML=''}
function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t}
function clearTimers(){while(timers.length)clearTimeout(timers.pop())}
var GS=null,keepNext=false;
/* estado de la partida: sobrevive al giro de la tablet (se reutiliza el mismo panel) */
function keepState(name,gen){
  if(keepNext&&GS&&GS.name===name){keepNext=false;return GS.v}
  keepNext=false;GS={name:name,v:gen()};return GS.v;
}
function go(f){clearTimers();cur=f;lw=app.clientWidth;lh=app.clientHeight;keepNext=false;f()}
function rego(f){clearTimers();cur=f;lw=app.clientWidth;lh=app.clientHeight;keepNext=true;f();keepNext=false}
function toInt(v){return parseInt(v,10)}
function clampInt(v,min,max,def){v=parseInt(v,10);if(isNaN(v))return def;return Math.max(min,Math.min(max,v))}
function byId(id){return document.getElementById(id)}
function dims(){var W=app.clientWidth,H=app.clientHeight;return {W:W,H:H,land:W>H*1.1}}
function cleanWord(s){
  s=String(s||'').toUpperCase().replace(/[ÁÀÂÄ]/g,'A').replace(/[ÉÈÊË]/g,'E').replace(/[ÍÌÎÏ]/g,'I').replace(/[ÓÒÔÖ]/g,'O').replace(/[ÚÙÛÜ]/g,'U');
  return s.replace(/[^A-ZÑ]/g,'');
}

/* ================= datos por defecto (genéricos, sin nada personal) ================= */
var DEF={
  settings:{v:6,pairs:6,objpic:'1',preview:3,showNames:false,memo:'distintas',wpg:6,qn:10,hlevel:1},
  themes:[
    {name:'LA CASA',words:['CASA','MESA','SILLA','CAMA','COCINA','VENTANA','PUERTA','SOFA','LAMPARA','ARMARIO','ESPEJO','BALCON']},
    {name:'FRUTAS',words:['MANZANA','PERA','NARANJA','LIMON','UVAS','CEREZAS','PLATANO','FRESA','MELON','SANDIA','CIRUELA','MELOCOTON']}
  ],
  questions:[
    {q:'¿CUÁNTOS DÍAS TIENE UNA SEMANA?',a:'7',wrong:['5','6','8']},
    {q:'¿DE QUÉ COLOR ES EL CIELO?',a:'AZUL',wrong:['VERDE','ROJO','NEGRO']},
    {q:'¿QUÉ ANIMAL HACE "MUUU"?',a:'LA VACA',wrong:['EL PERRO','EL GATO','LA OVEJA']},
    {q:'¿EN QUÉ ESTACIÓN HACE MÁS CALOR?',a:'EN VERANO',wrong:['EN INVIERNO','EN OTOÑO','EN NAVIDAD']}
  ],
  routine:[
    {name:'Desayuno',q:'¿A qué hora es el desayuno?',note:'',h:8,m:0,icon:'☕'},
    {name:'Comer',q:'¿A qué hora se come?',note:'',h:14,m:0,icon:'🍴'},
    {name:'Cenar',q:'¿A qué hora se cena?',note:'',h:21,m:0,icon:'🌙'}
  ]
};
function slotList(v){if(!v)return [];if(typeof v==='string')return [v];var o=[],i;for(i=0;i<v.length;i++)if(v[i])o.push(v[i]);return o}
function curList(p){return p.photos[0].concat(p.photos[1])}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
var GEN_WORDS='GALLINA CONEJO CABALLO BURRO CORDERO TERNERO PALOMA GORRION GOLONDRINA CIGUEÑA MARIPOSA ABEJA HORMIGA ARAÑA CULEBRA LAGARTIJA CARACOL TORTUGA DELFIN BALLENA TIBURON PULPO CANGREJO ELEFANTE JIRAFA LEON TIGRE MONO CEBRA LOBO ZORRO CIERVO JABALI ARDILLA ERIZO LECHUZA AGUILA PATO MONTAÑA RIO LAGO BOSQUE PRADO CAMINO VALLE FUENTE ARROYO NUBE LLUVIA NIEVE VIENTO TORMENTA ARCOIRIS ESTRELLA ENCINA ROBLE PINO OLMO CHOPO HAYA CASTAÑO NOGAL ALMENDRO FRESNO ROSA CLAVEL MARGARITA AMAPOLA GIRASOL ARMARIO SOFA CORTINA ALFOMBRA ESCALERA TEJADO CHIMENEA SOTANO PORTAL BALCON TERRAZA JARDIN COCINA SALON DORMITORIO ESPEJO LAMPARA RELOJ CUADRO ALMOHADA SABANA MANTA TOALLA JABON CEPILLO PEINE ESCOBA FREGONA CUBO SARTEN CAZUELA CUCHARA TENEDOR CUCHILLO PLATO VASO TAZA JARRA BOTELLA OLLA CAFETERA NEVERA HORNO MANTEL SERVILLETA CAMISA PANTALON FALDA CHAQUETA ABRIGO BUFANDA GUANTES CALCETINES ZAPATOS BOTAS SANDALIAS SOMBRERO GORRO PIJAMA DELANTAL PAÑUELO BOLSO CINTURON MEDICO ENFERMERA PANADERO CARPINTERO ZAPATERO HERRERO PASTOR ALBAÑIL COSTURERA MAESTRO CARTERO BOMBERO POLICIA PINTOR CAMARERO PESCADOR AGRICULTOR PELUQUERA CABEZA CABELLO FRENTE CEJA NARIZ BOCA DIENTE LENGUA OREJA CUELLO HOMBRO BRAZO CODO MUÑECA DEDO PECHO ESPALDA CINTURA RODILLA PIERNA TOBILLO IGLESIA PLAZA CALLE ESCUELA FARMACIA PANADERIA ESTANCO MERCADO PUENTE ERMITA CEMENTERIO AYUNTAMIENTO CARRETERA ESTACION AUTOBUS TREN BICICLETA TRACTOR CAMION DOMINGO LUNES MARTES JUEVES VIERNES SABADO PRIMAVERA VERANO OTOÑO INVIERNO MAÑANA TARDE NOCHE FIESTA CUMPLEAÑOS NAVIDAD REGALO MUSICA BAILE CANCION GUITARRA VIOLIN ACORDEON TAMBOR CAMPANA LIBRO PERIODICO CARTA TELEFONO RADIO TELEVISION'.split(' ');
function fixThemes(th){
  var out=[],mix=null,i,nm;
  for(i=0;i<th.length;i++){
    nm=String(th[i].name||'').trim().toUpperCase();
    if(nm==='COMIDAS'||nm==='BEBIDAS'){
      if(!mix){mix={name:'COMIDAS Y BEBIDAS',words:[]};out.push(mix)}
      mix.words=mix.words.concat(th[i].words||[]);
    }else out.push(th[i]);
  }
  var has=false;out.forEach(function(t){if(String(t.name).toUpperCase()==='VARIADAS')has=true});
  if(!has)out.push({name:'VARIADAS',words:GEN_WORDS.slice()});
  return out;
}
function norm(d){
  var o={refranes:[],raras:[],people:[],questions:DEF.questions.slice(),themes:fixThemes(DEF.themes.slice()),routine:DEF.routine.slice(),settings:{}},k;
  for(k in DEF.settings)o.settings[k]=DEF.settings[k];
  if(!d||typeof d!=='object')return o;
  if(d.people&&d.people.length!==undefined){
    o.people=d.people.map(function(p){
      var ph=p.photos||[];
      return {name:p.name,bday:p.bday||'',partner:p.partner||'',children:p.children||[],siblings:p.siblings||[],photos:[slotList(ph[0]),slotList(ph[1]),slotList(ph[2])]};
    });
  }
  if(d.refranes&&d.refranes.length)o.refranes=d.refranes;
  if(d.raras&&d.raras.length)o.raras=d.raras;
  if(d.questions&&d.questions.length)o.questions=d.questions;
  if(d.themes&&d.themes.length)o.themes=d.themes;
  o.themes=fixThemes(o.themes);
  if(d.routine&&d.routine.length)o.routine=d.routine;
  var s=d.settings||{};
  for(k in DEF.settings){if(s[k]!==undefined)o.settings[k]=s[k]}
  if(!(s.v>=5)){o.settings.pairs=Math.max(6,toInt(o.settings.pairs)||6);o.settings.showNames=false}
  if(!(s.v>=6)){o.settings.wpg=6}
  o.settings.v=6;
  return o;
}

/* ================= almacenamiento (IndexedDB, con localStorage de reserva) ================= */
var DB='juegos-madre',KEY='data';
function idb(cb){
  try{
    var r=indexedDB.open(DB,1);
    r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
    r.onsuccess=function(){cb(r.result)};
    r.onerror=function(){cb(null)};
    r.onblocked=function(){cb(null)};
  }catch(e){cb(null)}
}
function fromLS(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function toLS(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('No se ha podido guardar. Puede que falte espacio en la tablet.')}}
function loadData(cb){
  idb(function(db){
    if(!db){cb(norm(fromLS()));return}
    try{
      var rq=db.transaction('kv','readonly').objectStore('kv').get(KEY);
      rq.onsuccess=function(){cb(norm(rq.result||fromLS()))};
      rq.onerror=function(){cb(norm(fromLS()))};
    }catch(e){cb(norm(fromLS()))}
  });
}
function saveData(cb){
  idb(function(db){
    if(!db){toLS();if(cb)cb();return}
    try{
      var tx=db.transaction('kv','readwrite');
      tx.objectStore('kv').put(data,KEY);
      tx.oncomplete=function(){if(cb)cb()};
      tx.onerror=tx.onabort=function(){toLS();if(cb)cb()};
    }catch(e){toLS();if(cb)cb()}
  });
}

/* ================= elementos comunes de pantalla ================= */
var msgT=null;
var CHEER=['¡Muy bien!','¡Eso es!','¡Muy bien, Celia!','¡Qué bien lo haces, Celia!','¡Perfecto!','¡Así se hace, Celia!','¡Estupendo!','¡Fenomenal, Celia!','¡Lo has encontrado!','¡Qué lista eres, Celia!','¡Genial!','¡Sigue así, Celia!'];
var lastCh=-1;
function cheer(){var i;do{i=Math.floor(Math.random()*CHEER.length)}while(i===lastCh&&CHEER.length>1);lastCh=i;return CHEER[i]}
function msg(t,ms){var m=byId('msg');if(!m)return;m.innerHTML=t;if(msgT)clearTimeout(msgT);msgT=later(function(){m.innerHTML=''},ms||1800)}
function overlay(text,buttons,small){
  var o=el('div','ov');
  o.innerHTML='<div class="big'+(small?' sm':'')+'">'+text+'</div>';
  buttons.forEach(function(b){var x=el('button','bigbtn',b.t);x.onclick=b.f;o.appendChild(x)});
  app.appendChild(o);
}
function topbar(title){
  return '<div class="top"><button class="back" id="back">← Menú</button><div class="ttl">'+title+'</div></div><div id="msg"></div>';
}
function wireBack(){var b=byId('back');if(b)b.onclick=function(){go(home)}}
function noData(text){
  clear();app.appendChild(el('div','screen'));
  overlay(text,[{t:'Volver',f:function(){go(home)}}],true);
}
function endScreen(again){
  later(function(){overlay('¡Lo has hecho muy bien! 🎉',[
    {t:'Otra vez',f:function(){go(again)}},
    {t:'Volver al menú',f:function(){go(home)}}
  ])},900);
}

/* ================= menús ================= */
function menuScreen(title,items,back,isHome){
  clear();
  var d=dims(),s=el('div','screen scroll'),h='';
  if(back)h+='<div class="top"><button class="back" id="back">← Menú</button><div class="ttl">'+esc(title)+'</div></div>';
  else h+='<div class="h1" style="font-size:'+Math.round(Math.min(d.H*0.09,d.W*0.11))+'px">'+esc(title)+'</div>';

/* --- cartas tapadas: memoria --- */
function cls_(c){return c.done?'done':(c.up?'up':'down')}
function flipGame(title,S,again){
  var cards=S.cards,total=cards.length,b=setupBoard(title,total),nodes=[],i,matched=0,n=total/2;
  for(i=0;i<total;i++){if(cards[i].done)matched++;else cards[i].up=false}
  matched=matched/2;
  function setC(i,cls){nodes[i].className='card '+cls}
  var open=[],lock=false,fails=0;
  function hint(a){
    var k=cards[a].id,j;
    for(j=0;j<total;j++){if(cards[j].id===k&&!cards[j].done&&!cards[j].up)setC(j,'down hint')}
    later(function(){for(var j=0;j<total;j++){if(!cards[j].done&&!cards[j].up)setC(j,'down')}},2600);
  }
  function onCard(i){
    var cd=cards[i];
    if(lock||cd.done||cd.up)return;
    cd.up=true;setC(i,'up');open.push(i);
    if(open.length<2)return;
    lock=true;
    var a=open[0],bb=open[1];
    if(cards[a].id===cards[bb].id){
      later(function(){
        cards[a].done=cards[bb].done=true;setC(a,'done');setC(bb,'done');
        open=[];lock=false;fails=0;matched++;msg(cheer(),1800);
        if(matched===n)endScreen(again);
      },700);
    }else{
      fails++;
      later(function(){
        cards[a].up=cards[bb].up=false;setC(a,'down');setC(bb,'down');
        open=[];lock=false;
        if(fails>=2){fails=0;hint(a)}
      },1600);
    }
  }
  for(i=0;i<total;i++){nodes.push(makeNode(b,i,cards[i],true,onCard));setC(i,cls_(cards[i]))}
  if(matched===n){endScreen(again);return}
  var pv=toInt(data.settings.preview)||0;
  if(pv>0&&S.pv){
    S.pv=false;lock=true;
    for(i=0;i<total;i++){cards[i].up=true;setC(i,'up')}
    msg('Mira bien las cartas',pv*1000);
    later(function(){
      for(var j=0;j<total;j++){cards[j].up=false;setC(j,'down')}
      lock=false;msg('Ahora busca las parejas',2500);
    },pv*1000);
  }
}
function memoria(){
  var S=keepState('memoria',function(){
    var st=data.settings,iguales=st.memo==='iguales';
    var el_=data.people.filter(function(p){return iguales?(curList(p).length>=1):(curList(p).length>=2)});
    if(el_.length<2)return null;
    var n=Math.min(clampInt(st.pairs,2,8,6),el_.length),cards=[];
    pick(el_,n).forEach(function(p){
      var l=shuffle(curList(p)),a=l[0],b=iguales?a:l[1];
      cards.push({id:p.name,build:photoCard(a,p.name)});

function pairCards(pairs){
  var cards=[];
  pairs.forEach(function(p,i){
    cards.push({pid:i,key:p.a.key,build:p.a.build});
    cards.push({pid:i,key:p.b.key,build:p.b.build});
  });
  return {cards:shuffle(cards)};
}
function matchGame(title,S,validFn,again){
  var cards=S.cards,total=cards.length,b=setupBoard(title,total),nodes=[],i;
  function setC(i,cls){nodes[i].className='card '+cls}
  function ok(x,y){return x!==y&&(validFn?validFn(cards[x],cards[y]):cards[x].pid===cards[y].pid)}
  var sel=null,fails=0,locked=false;
  function anyLeft(){
    var x,y;
    for(x=0;x<total;x++){if(cards[x].done)continue;for(y=x+1;y<total;y++){if(!cards[y].done&&ok(x,y))return true}}
    return false;
  }
  function hint(a){for(var j=0;j<total;j++){if(!cards[j].done&&ok(a,j))setC(j,'up hint')}
    later(function(){for(var j=0;j<total;j++){if(!cards[j].done)setC(j,'up')}},2600)}
  function onCard(i){
    if(locked||cards[i].done)return;
    if(sel===null){sel=i;setC(i,'up sel');return}
    if(sel===i){setC(i,'up');sel=null;return}
    var a=sel;locked=true;setC(i,'up sel');
    if(ok(a,i)){
      later(function(){
        cards[a].done=cards[i].done=true;setC(a,'done');setC(i,'done');
        sel=null;locked=false;fails=0;msg(cheer(),1800);
        if(!anyLeft())endScreen(again);
      },600);
    }else{
      fails++;msg('Casi. Prueba otra vez',1800);
      later(function(){
        setC(a,'up');setC(i,'up');sel=null;locked=false;
        if(fails>=2){fails=0;hint(a)}
      },1000);
    }
  }
  for(i=0;i<total;i++){nodes.push(makeNode(b,i,cards[i],false,onCard));setC(i,cards[i].done?'done':'up')}
  if(!anyLeft())endScreen(again);
}

var FILL='AAEEEIOOUSRNDLTCMPBGVHFQJZ';

function tryGrid(keys,N,overlap){
  var g=[],place={},i,j,w,t,k;
  for(i=0;i<N;i++){g.push([]);for(j=0;j<N;j++)g[i].push('')}
  var order=keys.slice().sort(function(a,b){return b.length-a.length});
  for(w=0;w<order.length;w++){
    var word=order[w],placed=false;
    for(t=0;t<100&&!placed;t++){
      var rd_=Math.random(),dir=rd_<0.26?'H':(rd_<0.52?'V':'D');
      var maxr=(dir==='V'||dir==='D')?N-word.length:N-1,maxc=(dir==='H'||dir==='D')?N-word.length:N-1;
      if(maxr<0||maxc<0)continue;
      var r=Math.floor(Math.random()*(maxr+1)),c=Math.floor(Math.random()*(maxc+1)),ok=true,fresh=0,rr,cc,cell;
      for(k=0;k<word.length;k++){
        rr=(dir==='V'||dir==='D')?r+k:r;cc=(dir==='H'||dir==='D')?c+k:c;cell=g[rr][cc];
        if(cell===''){fresh++}
        else if(!overlap||cell!==word.charAt(k)){ok=false;break}
      }
      if(ok&&fresh>0){
        for(k=0;k<word.length;k++){rr=(dir==='V'||dir==='D')?r+k:r;cc=(dir==='H'||dir==='D')?c+k:c;g[rr][cc]=word.charAt(k)}
        place[word]={r:r,c:c,dir:dir};placed=true;
      }
    }
    if(!placed)return null;
  }
  for(i=0;i<N;i++)for(j=0;j<N;j++)if(g[i][j]==='')g[i][j]=FILL.charAt(Math.floor(Math.random()*FILL.length));
  return {g:g,place:place};
}
function nDiag(r){var n=0,k;for(k in r.place)if(r.place[k].dir==='D')n++;return n}
function buildGrid(keys){
  var total=0,longest=0,i;
  for(i=0;i<keys.length;i++){total+=keys[i].length;if(keys[i].length>longest)longest=keys[i].length}
  var N0=Math.max(8,longest,Math.ceil(Math.sqrt(total/0.55))),N,t,r,fb=null,need=keys.length>=5?2:1;
  for(N=N0;N<=N0+3;N++){
    for(t=0;t<60;t++){r=tryGrid(keys,N,false);if(r){if(nDiag(r)>=need)return r;if(!fb)fb=r}}
    for(t=0;t<60;t++){r=tryGrid(keys,N,true);if(r){if(nDiag(r)>=need)return r;if(!fb)fb=r}}
    if(fb)return fb;
  }
  return null;
}
function pickWords(all,want){
  var lg=shuffle(all.filter(function(x){return x.key.length>=6})),sh=shuffle(all.filter(function(x){return x.key.length<6}));
  var nl=Math.min(lg.length,Math.ceil(want*0.7)),out=lg.slice(0,nl).concat(sh.slice(0,want-nl));
  if(out.length<want)out=out.concat(lg.slice(nl,nl+want-out.length));
  return shuffle(out);
}
function sopa(ti){

    if(!anchor){anchor=p;flags[p.r][p.c].s=true;paint(p.r,p.c);return}
    if(anchor.r===p.r&&anchor.c===p.c){clearAnchor();return}

    check(cells);
  }

  function onMove(x,y){
    if(!down)return;
    var p=cellAt(x,y);if(!p)return;
    if(!moved&&p.r===down.r&&p.c===down.c)return;
    moved=true;clearAnchor();clearDrag();
    dragCells=lineCells(down,p,true);setRange(dragCells,true);
  }
  function onUp(){
    if(!down)return;
    var start=down,was=moved;down=null;moved=false;
    if(was&&dragCells){var cells=dragCells;clearDrag();check(cells);return}
    tap(start);
  }
  function cancel(){down=null;moved=false;clearDrag()}
  if(window.PointerEvent){
    grid.addEventListener('pointerdown',function(e){try{grid.setPointerCapture(e.pointerId)}catch(x){}onDown(e.clientX,e.clientY)});
    grid.addEventListener('pointermove',function(e){onMove(e.clientX,e.clientY)});
    grid.addEventListener('pointerup',onUp);
    grid.addEventListener('pointercancel',cancel);
  }else{
    grid.onclick=function(e){var p=cellAt(e.clientX,e.clientY);if(p)tap(p)};
  }

}

function genDistractors(a,k,have){
  var cands=[],m,i;
  if((m=/^A LAS (\d{1,2}):(\d{2})$/i.exec(a))){
    for(i=7;i<=12;i++){cands.push('A LAS '+i+':00');cands.push('A LAS '+i+':30')}
  }else if(/^(\d{1,2}) DE ([A-ZÁÉÍÓÚÑ]+)$/i.test(a)){
    data.people.forEach(function(p){if(p.bday)cands.push(p.bday)});
    data.questions.forEach(function(q){if(/^\d{1,2} DE [A-ZÁÉÍÓÚÑ]+$/i.test(String(q.a)))cands.push(String(q.a))});
    for(i=0;i<12;i++)cands.push((1+Math.floor(Math.random()*28))+' DE '+MESES[Math.floor(Math.random()*12)]);
  }else if(/^\d+$/.test(a)){
    var base=toInt(a);
    for(i=-4;i<=4;i++){if(i!==0&&base+i>=0)cands.push(String(base+i))}
  }
  cands=uniq(cands).filter(function(x){return x!==a&&have.indexOf(x)<0});
  return pick(cands,k);
}
function buildOptions(q){
  var a=String(q.a),wrong=uniq((q.wrong||[]).map(String).filter(function(x){return x!==''&&x!==a}));
  if(wrong.length<3)wrong=wrong.concat(genDistractors(a,3-wrong.length,wrong));
  return shuffle([a].concat(wrong.slice(0,3)));
}

function tokens_(t){var o={},m=String(t).toLowerCase().match(/[a-záéíóúñü]{4,}/g)||[];m.forEach(function(x){o[x]=1});return o}
function similar_(a,b){
  var ta=tokens_(a),tb=tokens_(b),i=0,n=0,k;
  for(k in ta){n++;if(tb[k])i++}
  var m=0;for(k in tb)m++;
  var u=n+m-i;return u>0?i/u:0;
}

      var pool=shuffle(L.filter(function(x){return x[0].toLowerCase()!==r[0].toLowerCase()&&x[1].toLowerCase()!==r[1].toLowerCase()&&similar_(x[1],r[1])<0.3}));
      pool.sort(function(x,y){return Math.abs(x[1].length-r[1].length)-Math.abs(y[1].length-r[1].length)});
      var near=shuffle(pool.slice(0,30)),w=[],i;
      for(i=0;i<near.length&&w.length<3;i++){var ok=true;for(var j=0;j<w.length;j++)if(similar_(near[i][1],w[j])>=0.3)ok=false;if(ok)w.push(near[i][1])}
      if(w.length<3)return null;
      return {q:r[0]+'…',a:r[1],opts:shuffle([r[1]].concat(w))};
    }).filter(function(x){return x});

var HN=['','una','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce'];
var MN={5:'cinco',10:'diez',20:'veinte',25:'veinticinco'};
function h12(h){return (h%12)||12}
function pad(n){return n<10?'0'+n:''+n}
function per(h){return (h>=6&&h<12)?'m':((h>=12&&h<20)?'t':'n')}
function dayPart(h){return h===12?'del mediodía':(per(h)==='m'?'de la mañana':(per(h)==='t'?'de la tarde':'de la noche'))}
function hourWord(h){var x=h12(h);return (x===1?'la ':'las ')+HN[x]}
function timeNum(t){return h12(t.h)+':'+pad(t.m)}
function timeWords(t){
  var h=t.h,m=t.m,base;
  if(m===0)base=hourWord(h);
  else if(m<=30)base=hourWord(h)+' '+(m===15?'y cuarto':(m===30?'y media':'y '+(MN[m]||m)));
  else base=hourWord((h+1)%24)+' '+(m===45?'menos cuarto':'menos '+(MN[60-m]||(60-m)));
  return base+' '+dayPart(h);
}
function skyIcon(h,size){
  var p=per(h),ic=p==='m'?'☀️':(p==='t'?'🌇':'🌙');
  return '<div class="pi" style="font-size:'+Math.round(size*0.16)+'px">'+ic+'</div>';
}
function clockSvg(h,m,size){
  var ha=((h%12)+m/60)*30,ma=m*6,i,a,x,y,s='<svg viewBox="0 0 200 200" width="'+size+'" height="'+size+'">';
  s+='<circle cx="100" cy="100" r="96" fill="#fff" stroke="#1F4E79" stroke-width="6"/>';
  for(i=0;i<60;i++){
    if(i%5===0)continue;
    a=i*6*Math.PI/180;
    s+='<line x1="'+(100+90*Math.sin(a)).toFixed(1)+'" y1="'+(100-90*Math.cos(a)).toFixed(1)+'" x2="'+(100+94*Math.sin(a)).toFixed(1)+'" y2="'+(100-94*Math.cos(a)).toFixed(1)+'" stroke="#999" stroke-width="1.5"/>';
  }
  for(i=1;i<=12;i++){
    a=i*30*Math.PI/180;x=100+76*Math.sin(a);y=100-76*Math.cos(a)+8;
    s+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b1b1b" font-family="Arial,sans-serif">'+i+'</text>';
  }
  function hand(ang,len,w,col){
    var r=ang*Math.PI/180;
    return '<line x1="100" y1="100" x2="'+(100+len*Math.sin(r)).toFixed(1)+'" y2="'+(100-len*Math.cos(r)).toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  }
  s+=hand(ha,48,10,'#1F4E79')+hand(ma,72,5,'#C62828')+'<circle cx="100" cy="100" r="7" fill="#333"/></svg>';
  return s;
}
function minsOf(t){return (t.h%12)*60+t.m}
function dist12(a,b){var d=Math.abs(minsOf(a)-minsOf(b));return Math.min(d,720-d)}
function genTimes(c,lvl){
  var out=[c],tries=0,gap=lvl>=2?60:120,mins=[0,30,15,45];
  if(lvl>=2)out.push({h:(c.h+12)%24,m:c.m});
  while(out.length<4&&tries<500){
    tries++;
    var cand={h:6+Math.floor(Math.random()*18),m:Math.random()<0.8?c.m:mins[Math.floor(Math.random()*4)]},ok=true,i;
    for(i=0;i<out.length;i++){if(dist12(out[i],cand)<gap){ok=false;break}}
    if(ok)out.push(cand);
  }
  while(out.length<4)out.push({h:6+((c.h+out.length*3)%18),m:c.m});
  return shuffle(out);
}
function sameT(a,b){return a.h===b.h&&a.m===b.m}
function routineList(){return data.routine.filter(function(r){return r&&r.h!==undefined})}

function horasA(){
  var rt=routineList(),d=dims(),lvl=clampInt(data.settings.hlevel,1,2,1);

  s.innerHTML=topbar('¿Qué hora es?')+'<div id="hbox"></div>';

  var fo=Math.round(d.land?Math.min(d.H*0.036,d.W*0.022):Math.min(d.H*0.026,d.W*0.045));
  function show(){
    if(S.idx>=list.length){overlay('¡Lo has hecho muy bien, Celia! 🎉',[{t:'Otra vez',f:function(){go(horasA)}},{t:'Volver al menú',f:function(){go(home)}}]);return}
    var r=list[S.idx],c={h:r.h,m:r.m||0},opts=S.opts||(S.opts=genTimes(c,lvl)),fails=0,locked=false,btns=[];
    var clock='<div class="sky sky-'+per(c.h)+'" style="width:'+cs+'px;height:'+cs+'px;margin:0 auto">'+skyIcon(c.h,cs)+'<div style="padding-top:'+Math.round(cs*0.04)+'px">'+clockSvg(c.h,c.m,cs-16)+'</div></div>';

      var b=el('button','opt','<span style="font-size:1.5em">'+timeNum(t)+'</span><br>'+esc(timeWords(t)));

      b.onclick=function(){

        if(sameT(t,c)){
          locked=true;b.className='opt ok';msg(cheer(),1400);
          later(function(){S.idx++;S.opts=null;show()},1500);
        }else{
          b.disabled=true;b.className='opt off';fails++;msg('Casi. Prueba otra vez',1800);
          if(fails>=2)btns.forEach(function(x){if(sameT(x.t,c))x.b.className+=' hint'});
        }
      };
      ob.appendChild(b);btns.push({b:b,t:t});
    });
  }
  show();
}
function horasB(){

  if(!rt.length){noData('No hay rutina cargada.');return}

    var r=list[S.idx],c={h:r.h,m:r.m||0},opts=S.opts||(S.opts=genTimes(c,lvl)),fails=0,locked=false,btns=[],box=byId('hbox');
    box.innerHTML='<div class="hq" style="font-size:'+fq+'px"><span style="font-size:1.4em">'+(r.icon||'')+'</span> '+esc(r.q||r.name)+
      (r.note?'<div style="font-size:'+Math.round(fq*0.6)+'px;color:#777;font-weight:normal">('+esc(r.note)+')</div>':'')+'</div><div id="hopts" style="text-align:center;margin-top:1vh"></div>';
    var ob=byId('hopts');
    opts.forEach(function(t){
      var b=el('div','ck','<div class="sky sky-'+per(t.h)+'" style="width:'+cs+'px;height:'+cs+'px">'+skyIcon(t.h,cs)+'<div style="padding-top:'+Math.round(cs*0.04)+'px">'+clockSvg(t.h,t.m,cs-12)+'</div></div>'+
        '<div style="width:'+cs+'px;padding:4px 6px 6px;font-size:'+fc+'px;line-height:1.15"><span style="font-size:1.35em">'+timeNum(t)+'</span><br>'+esc(timeWords(t))+'</div>');
      b.onclick=function(){
        if(locked)return;
        if(sameT(t,c)){
          locked=true;b.className='ck ok';msg(cheer(),1400);
          later(function(){S.idx++;S.opts=null;show()},1500);
        }else{
          b.className='ck off';b.onclick=null;fails++;msg('Casi. Prueba otra vez',1800);
          if(fails>=2)btns.forEach(function(x){if(sameT(x.t,c))x.b.className='ck hint'});
        }
      };
      ob.appendChild(b);btns.push({b:b,t:t});
    });
  }
  show();
}

/* ================= panel de ajustes ================= */
function resizeFile(file,max,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var w=im.width,h=im.height,sc=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement('canvas');
      cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',0.82));
    };
    im.onerror=function(){cb(null)};
    im.src=fr.result;
  };
  fr.onerror=function(){cb(null)};
  fr.readAsDataURL(file);
}
function rotate(url,cb){
  var im=new Image();
  im.onload=function(){
    var cv=document.createElement('canvas');
    cv.width=im.height;cv.height=im.width;
    var x=cv.getContext('2d');
    x.translate(cv.width/2,cv.height/2);x.rotate(Math.PI/2);
    x.drawImage(im,-im.width/2,-im.height/2);
    cb(cv.toDataURL('image/jpeg',0.82));
  };
  im.src=url;
}
function selHtml(id,label,opts,curv){
  var o='',i;
  for(i=0;i<opts.length;i++)o+='<option value="'+opts[i][0]+'"'+(String(opts[i][0])===String(curv)?' selected':'')+'>'+opts[i][1]+'</option>';
  return '<p>'+label+' <select id="'+id+'">'+o+'</select></p>';
}
function admin(){
  clear();
  var st=data.settings,s=el('div','screen adm'),h='';
  h+='<div class="ahead"><button class="back" id="back">← Volver</button><span class="atitle">Panel de ajustes</span></div>';
  h+='<h2>Datos</h2><p class="small" id="sum"></p>';
  h+='<div class="box"><b>Importar archivo de datos (.json)</b><br><span class="small">Sustituye los datos actuales (personas, fotos, preguntas, palabras, rutina).</span><br><br><input type="file" id="imp" accept=".json,application/json"> <span id="imsg"></span></div>';
  h+='<div class="box"><b>Cargar fotos por lote</b><br><span class="small">Nombre del archivo: NOMBRE_01.jpg, NOMBRE_02.jpg (actuales) y NOMBRE_03.jpg (de pequeño). Si hay varias fotos del mismo tipo, añade una letra: NOMBRE_01a.jpg, NOMBRE_01b.jpg… (el juego elige una al azar cada vez). El nombre debe coincidir con el de la persona.</span><br><br><input type="file" id="bfile" accept="image/*" multiple> <div id="bmsg" class="small"></div></div>';
  h+='<div class="box"><b>Copia de seguridad</b><br><span class="small">Las fotos solo están en esta tablet. Si se borran los datos del navegador, se pierden.</span><br><br><button class="abtn" id="exp">Exportar copia</button> <span id="emsg"></span></div>';
  h+='<h2>Personas</h2><div id="plist"></div>';
  h+='<h2>Ajustes</h2>';
  h+=selHtml('s_pairs','Parejas en cada partida:',[[3,'3 (6 cartas)'],[4,'4 (8 cartas)'],[5,'5 (10 cartas)'],[6,'6 (12 cartas, 3x4)'],[7,'7 (14 cartas)'],[8,'8 (16 cartas, 4x4)']],st.pairs);
  h+=selHtml('s_prev','Memoria: enseñar las cartas al empezar:',[[0,'No'],[3,'3 segundos'],[5,'5 segundos'],[8,'8 segundos']],st.preview);
  h+=selHtml('s_memo','Memoria: la pareja son:',[['distintas','Dos fotos distintas de la misma persona (difícil)'],['iguales','La misma foto repetida (fácil)']],st.memo);
  h+=selHtml('s_wpg','Palabras por sopa de letras:',[[3,'3'],[4,'4'],[5,'5'],[6,'6 (recomendado)'],[7,'7'],[8,'8'],[9,'9'],[10,'10']],st.wpg);
  h+=selHtml('s_qn','Preguntas por partida (preguntas, refranes, palabras raras, sumas):',[[5,'5'],[10,'10'],[15,'15'],[20,'20'],[60,'Todas']],st.qn);
  h+=selHtml('s_objpic','Busca el objeto: enseñar también el dibujo:',[['1','Sí (más fácil)'],['0','No, solo el nombre']],st.objpic);
  h+=selHtml('s_hl','Horas, nivel:',[[1,'1 - horas muy distintas'],[2,'2 - incluye la misma hora de mañana y de noche']],st.hlevel);
  h+='<p class="small">Preguntas, palabras y rutina se cambian en el Excel y se vuelven a generar con generar_datos.py.</p>';
  s.innerHTML=h;app.appendChild(s);
  byId('back').onclick=function(){go(home)};
  function say(id,t){byId(id).innerHTML=t}

  function summary(){
    var np=data.people.length,nf=0,i,j,nd=(data.refranes||[]).length,nr=(data.raras||[]).length;
    for(i=0;i<np;i++)for(j=0;j<3;j++)nf+=data.people[i].photos[j].length;
    say('sum',np+' personas · '+nf+' fotos cargadas  · '+data.questions.length+' preguntas · '+data.themes.length+' temas de sopa · '+data.routine.length+' actividades de rutina · '+nd+' refranes · '+nr+' palabras raras');
  }
  function drawList(){
    var out='',i,j;
    for(i=0;i<data.people.length;i++){
      var p=data.people[i];
      out+='<div class="prow"><div class="pn"><b>'+esc(p.name)+'</b>'+(p.bday?' · '+esc(p.bday):'')+'</div>';
      for(j=0;j<3;j++){
        var arr=p.photos[j],q;
        out+='<div class="slot">';
        if(!arr.length)out+='<div class="ph">—</div>';
        for(q=0;q<arr.length;q++)out+='<div style="display:inline-block;margin:2px"><img src="'+arr[q]+'" alt=""><button class="abtn" data-i="'+i+'" data-s="'+j+'" data-q="'+q+'">↻ Girar</button></div>';
        out+='0'+(j+1)+'</div>';
      }
      out+='</div>';
    }
    byId('plist').innerHTML=out||'<p class="small">Todavía no hay personas. Importa un archivo de datos.</p>';
    summary();
  }
  drawList();
  byId('plist').onclick=function(e){
    var t=e.target,i=t.getAttribute&&t.getAttribute('data-i');
    if(i===null||i===undefined)return;
    var sl=toInt(t.getAttribute('data-s')),p=data.people[toInt(i)];
    var qi=toInt(t.getAttribute('data-q'));
    rotate(p.photos[sl][qi],function(u){p.photos[sl][qi]=u;saveData(drawList)});
  };

  byId('imp').onchange=function(){
    var f=this.files&&this.files[0];
    if(!f)return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d||(!d.people&&!d.questions&&!d.themes))throw new Error('x');
        if(!confirm('Esto sustituye todos los datos actuales. ¿Continuar?'))return;
        var keep=data.settings;
        data=norm(d);
        for(var k in keep){if(!(d.settings&&d.settings[k]!==undefined))data.settings[k]=keep[k]}
        saveData(function(){go(admin)});
      }catch(e){say('imsg','Archivo no válido')}
    };
    fr.readAsText(f);
  };
  byId('bfile').onchange=function(){
    var files=Array.prototype.slice.call(this.files||[]),i=0,ok=0,bad=[],touched={};
    if(!files.length)return;
    say('bmsg','Procesando 0/'+files.length+'…');
    (function next(){
      if(i>=files.length){
        saveData(function(){
          say('bmsg','✔ '+ok+' fotos colocadas.'+(bad.length?' Sin coincidencia: '+esc(bad.join(', ')):''));
          drawList();
        });
        return;
      }
      var f=files[i++],m=/^(.*?)[\s_\-]*0?([1-3])[a-z]?\.[a-z0-9]+$/i.exec(f.name),p=null,k;
      if(m){k=cleanWord(m[1]);data.people.forEach(function(x){if(cleanWord(x.name)===k)p=x})}
      if(!p){bad.push(f.name);next();return}
      resizeFile(f,700,function(u){
        if(u){var sl_=toInt(m[2])-1,key_=p.name+'|'+sl_;if(!touched[key_]){touched[key_]=1;p.photos[sl_]=[]}p.photos[sl_].push(u);ok++}else bad.push(f.name);
        say('bmsg','Procesando '+i+'/'+files.length+'…');
        next();
      });
    })();
  };
  byId('exp').onclick=function(){
    try{
      var b=new Blob([JSON.stringify(data)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download='juegos-copia-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u)},1000);
    }catch(e){say('emsg','No se ha podido exportar')}
  };
  function bind(id,key,conv){byId(id).onchange=function(){data.settings[key]=conv(this.value);saveData()}}
  bind('s_pairs','pairs',toInt);bind('s_prev','preview',toInt);bind('s_memo','memo',String);
  bind('s_wpg','wpg',toInt);bind('s_qn','qn',toInt);bind('s_hl','hlevel',toInt);bind('s_objpic','objpic',String);
}
